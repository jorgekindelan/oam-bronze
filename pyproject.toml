[project]
name = "oam-bronze"
version = "0.1.0"
description = "OAM Bronze layer for European regulatory filings (discovery + download + immutable storage)."
readme = "README.md"
requires-python = ">=3.12"
authors = [{name="OAM"}]
license = {text = "Proprietary"}

dependencies = [
  "httpx>=0.27",
  "tenacity>=8.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-dateutil>=2.9",
  "PyYAML>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
]

[project.scripts]
oam = "oam.cli:app"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
target-version = "py312"

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
check_untyped_defs = true
strict_optional = true


[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.4",
    "types-python-dateutil>=2.9.0.20260302",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true
